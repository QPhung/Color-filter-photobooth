<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EigenBooth – Filters</title>

<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Saira+Stencil+One&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
/* FILTER EFFECTS */
.filter-none img { filter:none; }
.filter-grayscale img { filter:grayscale(100%); }
.filter-sepia img { filter:sepia(80%); }
.filter-warm img { filter:saturate(150%) hue-rotate(-15deg); }
.filter-neon img { filter:contrast(140%) saturate(180%); }
.filter-cyberpunk img { filter:hue-rotate(260deg) saturate(180%); }

/* FRAME COLORS */
.frame-yellow { background: var(--yellow); }
.frame-green { background: var(--green); }
.frame-red { background: var(--red); }

/* LAYOUT */
body.inner {
    display: flex;
    height: 100vh;
    overflow: hidden;
}

.left, .middle, .right {
    padding: 20px;
}

/* STRIP */
.photo-strip {
    width: 180px;
    padding: 10px;
    border: 3px solid var(--dark);
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.photo-slot {
    aspect-ratio: 4/3;
    background: #ddd;
    overflow: hidden;
}
.photo-slot img {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* BUTTONS */
.filter-btn {
    padding:10px;
    margin:4px;
    cursor:pointer;
}

/* MATRIX */
.matrix span {
    display:inline-block;
    width:30px;
    text-align:center;
}
</style>
</head>

<body class="inner">

<!-- LEFT: STRIP -->
<div class="left">
    <div id="filter-strip" class="photo-strip frame-yellow filter-none">
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>
    </div>
</div>

<!-- MIDDLE: FILTERS -->
<div class="middle">
    <h2>Choose Filter</h2>

    <button class="filter-btn" onclick="setFilter('none')">Original</button>
    <button class="filter-btn" onclick="setFilter('grayscale')">Grayscale</button>
    <button class="filter-btn" onclick="setFilter('sepia')">Sepia</button>
    <button class="filter-btn" onclick="setFilter('warm')">Warm</button>
    <button class="filter-btn" onclick="setFilter('neon')">Neon</button>
    <button class="filter-btn" onclick="setFilter('cyberpunk')">Cyberpunk</button>

    <br><br>
    <button onclick="saveAndContinue()">Finish →</button>
</div>

<!-- RIGHT: MATRIX -->
<div class="right">
    <h3>Filter Matrix</h3>
    <div class="matrix" id="matrix">
        <div><span id="m00">1</span><span id="m01">0</span><span id="m02">0</span></div>
        <div><span id="m10">0</span><span id="m11">1</span><span id="m12">0</span></div>
        <div><span id="m20">0</span><span id="m21">0</span><span id="m22">1</span></div>
    </div>
</div>

<script src="state.js"></script>

<script>
// ─────────────────────────────
// FILTER DATA
// ─────────────────────────────
const FILTERS = {
    none: [[1,0,0],[0,1,0],[0,0,1]],
    grayscale: [[0.299,0.587,0.114],[0.299,0.587,0.114],[0.299,0.587,0.114]],
    sepia: [[0.393,0.769,0.189],[0.349,0.686,0.168],[0.272,0.534,0.131]],
    warm: [[1.15,0,0],[0,1.05,0],[0,0,0.8]],
    neon: [[1.5,-0.2,-0.2],[-0.2,1.5,-0.2],[-0.2,-0.2,1.5]],
    cyberpunk: [[1.2,0,0.4],[0,0.7,0.2],[0.3,0.1,1.3]]
};

let currentFilter = "none";


// ─────────────────────────────
// INIT
// ─────────────────────────────
window.onload = () => {
    renderPhotosToStrip('#filter-strip');

    const frame = sessionStorage.getItem('eigenbooth_frame') || 'yellow';
    const strip = document.getElementById('filter-strip');

    strip.classList.add('frame-' + frame);
};


// ─────────────────────────────
// APPLY FILTER
// ─────────────────────────────
function setFilter(name) {
    currentFilter = name;

    const strip = document.getElementById('filter-strip');

    // remove old filter classes
    strip.className = strip.className.replace(/filter-\S+/g, '');

    // add new filter
    strip.classList.add('filter-' + name);

    updateMatrix(name);
}


// ─────────────────────────────
// UPDATE MATRIX DISPLAY
// ─────────────────────────────
function updateMatrix(name) {
    const m = FILTERS[name];

    for (let r=0;r<3;r++){
        for (let c=0;c<3;c++){
            document.getElementById(`m${r}${c}`).textContent = m[r][c];
        }
    }
}


// ─────────────────────────────
// SAVE + GO NEXT
// ─────────────────────────────
function saveAndContinue() {
    sessionStorage.setItem('eigenbooth_filter', currentFilter);
    window.location.href = "end.html";
}
</script>

</body>
</html>
