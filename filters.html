<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EigenBooth – Filters</title>

    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Saira+Stencil+One&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ── FILTER EFFECTS ─────────────────────────────── */
        .filter-none      .photo-slot img { filter: none; }
        .filter-grayscale .photo-slot img { filter: grayscale(100%); }
        .filter-sepia     .photo-slot img { filter: sepia(80%); }
        .filter-warm      .photo-slot img { filter: saturate(150%) hue-rotate(-15deg); }
        .filter-neon      .photo-slot img { filter: contrast(140%) saturate(180%); }
        .filter-cyberpunk .photo-slot img { filter: hue-rotate(260deg) saturate(180%); }

        /* ── FRAME COLORS ───────────────────────────────── */
        .frame-yellow { background: var(--yellow); border-color: var(--dark); }
        .frame-green  { background: var(--green);  border-color: var(--dark); }
        .frame-red    { background: var(--red);    border-color: var(--dark); }

        /* ── THREE-COLUMN LAYOUT ────────────────────────── */
        .filter-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 36px;
            z-index: 10;
            position: relative;
        }

        /* ── FILTER BUTTON GRID ─────────────────────────── */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 12px;
            border: 3px solid var(--dark);
            border-radius: 8px;
            font-family: 'Saira Stencil One', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--dark);
            transition: all 0.1s ease;
            background: var(--white);
            color: var(--dark);
            text-transform: uppercase;
        }
        .filter-btn:hover  { opacity: 0.85; }
        .filter-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dark); }
        .filter-btn.active {
            box-shadow: none;
            transform: translate(2px, 2px);
            background: var(--dark);
            color: var(--white);
        }

        /* ── MATRIX CARD ────────────────────────────────── */
        .matrix-card {
            background: var(--white);
            border: 3px solid var(--dark);
            border-radius: 8px;
            padding: 14px 18px;
            box-shadow: 4px 4px 0 var(--dark);
        }
        .matrix-title {
            font-size: 0.7rem;
            color: #888;
            font-family: 'DM Mono', monospace;
            margin-bottom: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .matrix-wrap {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .matrix-bracket {
            font-size: 2.8rem;
            font-weight: 100;
            color: var(--dark);
            line-height: 1;
            user-select: none;
        }
        .matrix-inner {
            display: grid;
            grid-template-columns: repeat(3, 52px);
            gap: 4px;
        }
        .matrix-cell {
            font-family: 'DM Mono', monospace;
            font-size: 0.76rem;
            text-align: center;
            padding: 5px 2px;
            background: #f5f5f5;
            border-radius: 4px;
            transition: background 0.3s, color 0.3s;
        }
        .matrix-cell.highlight { background: var(--dark); color: var(--white); }

        .filter-label {
            font-family: 'Irish Grover', cursive;
            -webkit-text-stroke: 0.1px #ec1818;
            font-size: 1rem;
            text-align: center;
            margin-top: 8px;
        }

        /* ── 3D VIZ CARD ────────────────────────────────── */
        .viz-card {
            background: #0d0d0d;
            border: 3px solid var(--dark);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 4px 4px 0 var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        #viz-canvas {
            display: block;
            width: 260px;
            height: 260px;
            border-radius: 4px;
            cursor: grab;
        }
        #viz-canvas:active { cursor: grabbing; }

        .viz-legend {
            display: flex;
            gap: 14px;
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
        }
        .viz-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #aaa;
        }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .viz-hint {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: #555;
        }
    </style>
</head>
<body class="inner">

    <img src="assets/square_ruler.png" class="deco edge-tl">
    <img src="assets/compass.png"      class="deco edge-br">

    <div class="filter-layout">

        <!-- ── COL 1: PHOTO STRIP ─────────────────────── -->
        <div id="filter-strip" class="photo-strip frame-yellow filter-none">
            <div class="photo-slot"></div>
            <div class="photo-slot"></div>
            <div class="photo-slot"></div>
        </div>

        <!-- ── COL 2: CONTROLS ────────────────────────── -->
        <div class="options-sidebar">
            <h3 class="irish-font">Choose Your Filter:</h3>

            <div class="filter-grid">
                <button class="filter-btn active" id="btn-none"      onclick="setFilter('none')">Original</button>
                <button class="filter-btn"        id="btn-grayscale" onclick="setFilter('grayscale')">Grayscale</button>
                <button class="filter-btn"        id="btn-sepia"     onclick="setFilter('sepia')">Sepia</button>
                <button class="filter-btn"        id="btn-warm"      onclick="setFilter('warm')">Warm</button>
                <button class="filter-btn"        id="btn-neon"      onclick="setFilter('neon')">Neon</button>
                <button class="filter-btn"        id="btn-cyberpunk" onclick="setFilter('cyberpunk')">Cyberpunk</button>
            </div>

            <div class="matrix-card">
                <div class="matrix-title">Color Transform Matrix</div>
                <div class="matrix-wrap">
                    <span class="matrix-bracket">[</span>
                    <div class="matrix-inner">
                        <div class="matrix-cell" id="m00">1</div>
                        <div class="matrix-cell" id="m01">0</div>
                        <div class="matrix-cell" id="m02">0</div>
                        <div class="matrix-cell" id="m10">0</div>
                        <div class="matrix-cell" id="m11">1</div>
                        <div class="matrix-cell" id="m12">0</div>
                        <div class="matrix-cell" id="m20">0</div>
                        <div class="matrix-cell" id="m21">0</div>
                        <div class="matrix-cell" id="m22">1</div>
                    </div>
                    <span class="matrix-bracket">]</span>
                </div>
                <div class="filter-label" id="filter-label">Original</div>
            </div>

            <button class="btn-next yellow-btn" onclick="saveAndContinue()">
                Next →
            </button>
        </div>

        <!-- ── COL 3: 3D VIZ ──────────────────────────── -->
        <div class="viz-card">
            <canvas id="viz-canvas" width="260" height="260"></canvas>
            <div class="viz-legend">
                <div class="viz-legend-item">
                    <div class="legend-dot" style="background:#ff4444;"></div> R basis
                </div>
                <div class="viz-legend-item">
                    <div class="legend-dot" style="background:#44cc44;"></div> G basis
                </div>
                <div class="viz-legend-item">
                    <div class="legend-dot" style="background:#4488ff;"></div> B basis
                </div>
            </div>
            <div class="viz-hint">drag to orbit · ghost = identity</div>
        </div>

    </div>

    <script src="state.js"></script>
    <script>
        // ─────────────────────────────────────────────────
        // FILTER DATA
        // ─────────────────────────────────────────────────
        const FILTERS = {
            none:      { label: 'Original',  matrix: [[1,0,0],[0,1,0],[0,0,1]] },
            grayscale: { label: 'Grayscale', matrix: [[0.299,0.587,0.114],[0.299,0.587,0.114],[0.299,0.587,0.114]] },
            sepia:     { label: 'Sepia',     matrix: [[0.393,0.769,0.189],[0.349,0.686,0.168],[0.272,0.534,0.131]] },
            warm:      { label: 'Warm',      matrix: [[1.15,0,0],[0,1.05,0],[0,0,0.8]] },
            neon:      { label: 'Neon',      matrix: [[1.5,-0.2,-0.2],[-0.2,1.5,-0.2],[-0.2,-0.2,1.5]] },
            cyberpunk: { label: 'Cyberpunk', matrix: [[1.2,0,0.4],[0,0.7,0.2],[0.3,0.1,1.3]] },
        };

        let currentFilter = 'none';


        // ─────────────────────────────────────────────────
        // INIT PAGE
        // ─────────────────────────────────────────────────
        window.onload = () => {
            renderPhotosToStrip('#filter-strip');
            const frame = sessionStorage.getItem('eigenbooth_frame') || 'yellow';
            document.getElementById('filter-strip').classList.add('frame-' + frame);
            initViz();
        };


        // ─────────────────────────────────────────────────
        // SET FILTER
        // ─────────────────────────────────────────────────
        function setFilter(name) {
            currentFilter = name;

            // Swap CSS filter class on strip
            const strip = document.getElementById('filter-strip');
            strip.className = strip.className.replace(/filter-\S+/g, '').trim();
            strip.classList.add('filter-' + name);

            // Active button state
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + name).classList.add('active');

            // Update matrix display + highlight non-identity cells
            const { label, matrix: m } = FILTERS[name];
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.getElementById(`m${r}${c}`);
                    cell.textContent = m[r][c];
                    const isIdentity = (r === c && m[r][c] === 1) || (r !== c && m[r][c] === 0);
                    cell.classList.toggle('highlight', !isIdentity);
                }
            }
            document.getElementById('filter-label').textContent = label;

            // Animate 3D viz
            updateVizTarget(m);
        }


        // ─────────────────────────────────────────────────
        // SAVE + CONTINUE
        // ─────────────────────────────────────────────────
        function saveAndContinue() {
            sessionStorage.setItem('eigenbooth_filter', currentFilter);
            location.href = 'end.html';
        }


        // ═════════════════════════════════════════════════
        // THREE.JS — RGB BASIS VECTOR VISUALIZATION
        // ═════════════════════════════════════════════════
        let liveArrows = [];
        let curVecs    = [[1,0,0],[0,1,0],[0,0,1]];
        let tgtVecs    = [[1,0,0],[0,1,0],[0,0,1]];

        const ARROW_COLORS  = [0xff4444, 0x44cc44, 0x4488ff];
        const IDENTITY_VECS = [[1,0,0],[0,1,0],[0,0,1]];

        function initViz() {
            const canvas   = document.getElementById('viz-canvas');
            const W = 260, H = 260;

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(W, H);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const scene  = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(42, W / H, 0.01, 50);
            camera.position.set(2.8, 2.0, 2.8);
            camera.lookAt(0, 0, 0);
            scene.add(new THREE.AmbientLight(0xffffff, 1));

            // ── Subtle axis lines ──────────────────────────
            const axisMat = new THREE.LineBasicMaterial({
                color: 0x666666, transparent: true, opacity: 0.45
            });
            [
                [[-0.15,0,0],[1.6,0,0]],
                [[0,-0.15,0],[0,1.6,0]],
                [[0,0,-0.15],[0,0,1.6]]
            ].forEach(([from, to]) => {
                const geo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(...from),
                    new THREE.Vector3(...to)
                ]);
                scene.add(new THREE.Line(geo, axisMat));
            });

            // Axis-end dots (small spheres)
            const dotGeo = new THREE.SphereGeometry(0.03, 8, 8);
            [[1.6,0,0],[0,1.6,0],[0,0,1.6]].forEach(pos => {
                const dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x555555 }));
                dot.position.set(...pos);
                scene.add(dot);
            });

            // Origin dot
            const originDot = new THREE.Mesh(
                new THREE.SphereGeometry(0.045, 12, 12),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            scene.add(originDot);

            // ── Ghost arrows (identity, always static) ────
            IDENTITY_VECS.forEach((v, i) => {
                const dir    = new THREE.Vector3(...v).normalize();
                const length = new THREE.Vector3(...v).length();
                const arrow  = new THREE.ArrowHelper(
                    dir, new THREE.Vector3(0,0,0),
                    length, ARROW_COLORS[i], 0.14, 0.08
                );
                arrow.line.material.transparent = true;
                arrow.line.material.opacity      = 0.18;
                arrow.cone.material.transparent  = true;
                arrow.cone.material.opacity      = 0.18;
                scene.add(arrow);
            });

            // ── Live (animated) arrows ────────────────────
            liveArrows = curVecs.map((v, i) => {
                const dir    = new THREE.Vector3(...v).normalize();
                const length = new THREE.Vector3(...v).length();
                const arrow  = new THREE.ArrowHelper(
                    dir, new THREE.Vector3(0,0,0),
                    length, ARROW_COLORS[i], 0.14, 0.08
                );
                scene.add(arrow);
                return arrow;
            });

            // ── Orbit controls (manual) ───────────────────
            let rotX = 0.38, rotY = 0.55;
            let isDragging = false, autoSpin = true;
            let prevMouse  = { x: 0, y: 0 };

            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                autoSpin   = false;
                prevMouse  = { x: e.clientX, y: e.clientY };
                e.preventDefault();
            });
            canvas.addEventListener('mousemove', e => {
                if (!isDragging) return;
                rotY += (e.clientX - prevMouse.x) * 0.013;
                rotX += (e.clientY - prevMouse.y) * 0.013;
                rotX  = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotX));
                prevMouse = { x: e.clientX, y: e.clientY };
            });
            // Touch support
            canvas.addEventListener('touchstart', e => {
                isDragging = true; autoSpin = false;
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: true });
            canvas.addEventListener('touchmove', e => {
                if (!isDragging) return;
                rotY += (e.touches[0].clientX - prevMouse.x) * 0.013;
                rotX += (e.touches[0].clientY - prevMouse.y) * 0.013;
                rotX  = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotX));
                prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: true });
            window.addEventListener('mouseup',  () => isDragging = false);
            window.addEventListener('touchend', () => isDragging = false);

            // ── Render loop ───────────────────────────────
            function animate() {
                requestAnimationFrame(animate);

                // Lerp current vectors toward target
                curVecs.forEach((cv, i) => {
                    const tv = tgtVecs[i];
                    for (let j = 0; j < 3; j++) {
                        cv[j] += (tv[j] - cv[j]) * 0.07;
                    }
                    const v3  = new THREE.Vector3(...cv);
                    const len = v3.length();
                    if (len > 0.001) {
                        liveArrows[i].setDirection(v3.clone().normalize());
                        liveArrows[i].setLength(len, 0.14, 0.08);
                    }
                });

                if (autoSpin) rotY += 0.006;
                scene.rotation.set(rotX, rotY, 0);
                renderer.render(scene, camera);
            }
            animate();
        }


        // Called by setFilter — sets the target basis vectors
        // (columns of the matrix = where R, G, B basis go)
        function updateVizTarget(matrixRows) {
            tgtVecs = [
                [ matrixRows[0][0], matrixRows[1][0], matrixRows[2][0] ], // where î goes
                [ matrixRows[0][1], matrixRows[1][1], matrixRows[2][1] ], // where ĵ goes
                [ matrixRows[0][2], matrixRows[1][2], matrixRows[2][2] ], // where k̂ goes
            ];
        }
    </script>
</body>
</html>
